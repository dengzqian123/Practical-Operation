name: Deploy to ECS 
 
on: 
  push: 
    branches: [ "main" ] 
  workflow_dispatch: 
 
jobs: 
  deploy: 
    runs-on: ubuntu-latest 
 
    steps: 
    - name: Checkout code 
      uses: actions/checkout@v4 
 
    - name: Setup Node.js 
      uses: actions/setup-node@v4 
      with: 
        node-version: '20' 
 
    - name: Install dependencies 
      run: npm ci 
 
    - name: Build project 
      run: npm run build 
 
    - name: Create deployment package 
      run: | 
        cd dist 
        zip -r ../deploy.zip . 
        cd .. 
 
    - name: Upload to ECS 
      uses: appleboy/scp-action@v0.1.7 
      with: 
        host: \${{ secrets.ECS_HOST }} 
        username: \${{ secrets.ECS_USER }} 
        password: \${{ secrets.ECS_PASSWORD }} 
        port: 22 
        source: "deploy.zip" 
        target: "/tmp/" 
 
    - name: Deploy on ECS 
      uses: appleboy/ssh-action@v1.0.3 
      with: 
        host: \${{ secrets.ECS_HOST }} 
        username: \${{ secrets.ECS_USER }} 
        password: \${{ secrets.ECS_PASSWORD }} 
        port: 22 
        script: | 
          cd /tmp 
          unzip -o deploy.zip -d /var/www/nginx/ 
          rm -f deploy.zip 
          chown -R nginx:nginx /var/www/nginx 
          chmod -R 755 /var/www/nginx 
          systemctl reload nginx 
